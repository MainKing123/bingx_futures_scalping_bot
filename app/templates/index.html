<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scalping Bot Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>ICT/SMC Scalping Bot (MVP)</h1>

      <section class="card grid">
        <h2>Risk Configuration</h2>
        <form id="risk-form">
          <label>Equity (USDT) <input name="equity_usdt" type="number" step="0.1" value="1000" /></label>
          <label>Risk per trade (%) <input name="risk_per_trade_pct" type="number" step="0.1" value="0.5" /></label>
          <label>Max leverage <input name="max_leverage" type="number" step="1" value="10" /></label>
          <label>Stop buffer (%) <input name="stop_buffer_pct" type="number" step="0.1" value="0.1" /></label>
          <label>RR target <input name="rr_target" type="number" step="0.1" value="2" /></label>
          <label>Daily loss limit (%) <input name="daily_loss_limit_pct" type="number" step="0.1" value="3" /></label>
          <label>Max consecutive losses <input name="max_consecutive_losses" type="number" step="1" value="3" /></label>
          <label>Cooldown (minutes) <input name="cooldown_minutes" type="number" step="1" value="10" /></label>
          <button type="submit">Save risk config</button>
        </form>
      </section>

      <section class="card grid">
        <h2>Strategy Configuration</h2>
        <form id="strategy-form">
          <label>Premium zone <input name="premium_zone" type="number" step="0.01" value="0.65" /></label>
          <label>Discount zone <input name="discount_zone" type="number" step="0.01" value="0.35" /></label>
          <label>Min displacement (%) <input name="min_displacement_pct" type="number" step="0.01" value="0.12" /></label>
          <label>Min RR <input name="min_rr" type="number" step="0.1" value="1.5" /></label>
          <button type="submit">Save strategy config</button>
        </form>
      </section>

      <section class="card grid">
        <h2>Simulate Tick</h2>
        <form id="tick-form">
          <label>Price <input name="price" type="number" step="0.1" value="63000" /></label>
          <label>1m High <input name="high_1m" type="number" step="0.1" value="63100" /></label>
          <label>1m Low <input name="low_1m" type="number" step="0.1" value="62900" /></label>
          <label>30m High <input name="high_30m" type="number" step="0.1" value="64000" /></label>
          <label>30m Low <input name="low_30m" type="number" step="0.1" value="62000" /></label>
          <button type="submit">Process tick</button>
        </form>
      </section>


      <section class="card">
        <h2>Risk Guard Snapshot</h2>
        <div id="risk-summary" class="stats-grid">
          <article class="stat-item">
            <h3>Daily loss used</h3>
            <p id="daily-loss-used">0.00%</p>
          </article>
          <article class="stat-item">
            <h3>Daily loss limit</h3>
            <p id="daily-loss-limit">0.00%</p>
          </article>
          <article class="stat-item">
            <h3>Consecutive losses</h3>
            <p id="consecutive-losses">0</p>
          </article>
          <article class="stat-item">
            <h3>Cooldown until</h3>
            <p id="cooldown-until">—</p>
          </article>
        </div>
      </section>

      <section class="card">
        <h2>Live State</h2>
        <pre id="state-view">Loading...</pre>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
